name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; cancel any in-progress run
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js Static Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          # This triggers the basePath/assetPrefix in next.config.ts
          GITHUB_ACTIONS: "true"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static export to Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # next.config.ts sets output: 'export', which outputs to ./out
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
